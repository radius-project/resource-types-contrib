# Portability note: this schema is platform-neutral so the same type works with
# Azure (a Kubernetes RabbitMQ recipe on the AKS cluster), AWS Amazon MQ via
# Terraform modules, and Kubernetes RabbitMQ recipes. Only the recipePack source
# plus parameters/outputs mapping changes per platform; the developer-facing queue
# name and readOnly connection surface stay identical.
namespace: Radius.Messaging
types:
  rabbitMQ:
    description: |
      The Radius.Messaging/rabbitMQ Resource Type deploys a RabbitMQ message broker
      that speaks AMQP 0-9-1. It allows developers to create and connect to a queue
      as part of their Radius applications.

      You can provide the broker password directly through the optional sensitive
      `password` property. If omitted, the Kubernetes Recipe generates a random
      password. In both cases, the Recipe returns the effective password through the
      resource's managed `Radius.Security/secrets` resource and mounts it into the
      broker via `secretKeyRef`.
      ```bicep
      @secure()
      param password string

      resource queue 'Radius.Messaging/rabbitMQ@2025-08-01-preview' = {
        name: 'rabbitmq'
        properties: {
          environment: environment
          application: myApplication.id
          queue: 'jobs'
          username: 'radius'
          password: password
        }
      }
      ```

      To connect your workload to the queue, create a connection from the workload
      resource to the queue resource. The connection automatically injects
      environment variables named `CONNECTION_<CONNECTION-NAME>_<PROPERTY-NAME>`.
      For a connection named `rabbitmq`, the variables are:

      - CONNECTION_RABBITMQ_HOST
      - CONNECTION_RABBITMQ_PORT
      - CONNECTION_RABBITMQ_USERNAME

      The effective password is emitted only through the managed
      `Radius.Security/secrets` resource. Bind it into a container env var with a
      `secretKeyRef`, using `queue.properties.secrets.name` as the `secretName` and
      key `password`.

    apiVersions:
      '2025-08-01-preview':
        schema:
          type: object
          properties:
            environment:
              type: string
              description: "(Required) The Radius Environment ID. Typically set by the rad CLI. Typically value should be `environment`."
            application:
              type: string
              description: "(Optional) The Radius Application ID. `myApplication.id` for example."
            queue:
              type: string
              default: jobs
              description: "(Optional) The name of the queue to pre-provision on the broker. The Recipe creates this durable queue on the default virtual host when the broker starts, so it exists before your workload connects. Defaults to `jobs` if not provided."
            username:
              type: string
              default: radius
              description: "(Optional) The username the broker is provisioned with and that clients authenticate as. Defaults to `radius` if not provided. Avoid `guest`, which RabbitMQ restricts to loopback connections. The username is not sensitive and is exposed as a read-only connection value."
            password:
              type: string
              x-radius-sensitive: true
              description: "(Optional) The broker password. Radius encrypts this value at rest, redacts it on reads, and exposes it decrypted only to the Recipe. If omitted, the Kubernetes Recipe generates a random password. The effective password is always returned through the managed `secrets.password` output."
            host:
              type: string
              description: (Read Only) The host name used to connect to the broker. Mapped from the recipe's Service DNS name.
              readOnly: true
            port:
              type: integer
              description: (Read Only) The port used to connect to the broker over AMQP 0-9-1 (5672). Mapped from the recipe's output.
              readOnly: true
            secrets:
              type: object
              description: >-
                (Read Only) Recipe-generated secrets. The reserved `name` sub-property references
                the managed Radius.Security/secrets resource Radius materializes from the Recipe's
                `outputs.secrets`. Consumers bind a key into a container env var via `secretKeyRef`.
              properties:
                name:
                  type: string
                  readOnly: true
                  description: (Read Only) Name of the managed Radius.Security/secrets resource. Use as `secretName` in a container `secretKeyRef`.
                password:
                  type: string
                  readOnly: true
                  description: (Read Only) The effective broker password, delivered through the managed secret whether supplied or generated.
          required: [environment]
