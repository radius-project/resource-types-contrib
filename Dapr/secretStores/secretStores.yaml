namespace: Radius.Dapr
types:
  secretStores:
    description: |
      The Radius.Dapr/secretStores Resource Type deploys a Dapr secret store
      component. It replaces the legacy `Applications.Dapr/secretStores` type.

      If you do not set `componentType`, the default Recipe deploys a
      `secretstores.kubernetes` component. This component reads Kubernetes
      secrets in the namespace of the application:
      ```bicep
      resource secretStore 'Radius.Dapr/secretStores@2025-08-01-preview' = {
        name: 'secretstore'
        properties: {
          environment: environment
          application: myApplication.id
        }
      }
      ```

      To use a different Dapr secret store, set `componentType`, `version`, and
      `metadata`. The Recipe deploys only the Dapr component from these values.
      This replaces `resourceProvisioning: 'manual'` in the legacy type:
      ```bicep
      resource secretStore 'Radius.Dapr/secretStores@2025-08-01-preview' = {
        name: 'secretstore'
        properties: {
          environment: environment
          application: myApplication.id
          componentType: 'secretstores.hashicorp.vault'
          version: 'v1'
          metadata: {
            vaultAddr: {
              value: 'https://vault.vault.svc.cluster.local:8200'
            }
            vaultToken: {
              secretKeyRef: {
                name: 'vault-token'
                key: 'token'
              }
            }
          }
        }
      }
      ```

      Other Dapr components can read secrets from this secret store. Set
      `auth.secretStore` on the component to the name of this secret store:
      ```bicep
      resource stateStore 'Radius.Dapr/stateStores@2025-08-01-preview' = {
        name: 'statestore'
        properties: {
          environment: environment
          application: myApplication.id
          componentType: 'state.redis'
          metadata: {
            redisHost: {
              value: 'redis.cache.svc.cluster.local:6379'
            }
            redisPassword: {
              secretKeyRef: {
                name: 'redis-password'
                key: 'redis-password'
              }
            }
          }
          auth: {
            secretStore: secretStore.properties.componentName
          }
        }
      }
      ```

      To read secrets from the application, enable the Dapr sidecar on a
      container and connect the container to the secret store:
      ```bicep
      resource backend 'Radius.Compute/containers@2025-08-01-preview' = {
        name: 'backend'
        properties: {
          environment: environment
          application: myApplication.id
          containers: {
            backend: {
              image: 'myregistry/backend:latest'
              ports: {
                web: {
                  containerPort: 3000
                }
              }
            }
          }
          connections: {
            secrets: {
              source: secretStore.id
            }
          }
          extensions: {
            daprSidecar: {
              appId: 'backend'
              appPort: 3000
            }
          }
        }
      }
      ```

      The Dapr component name is the resource name. On compatible Kubernetes
      Container Recipes, the connection injects environment variables named
      `CONNECTION_<CONNECTION-NAME>_<PROPERTY-NAME>`. In this example, the
      application reads the component name from `CONNECTION_SECRETS_COMPONENTNAME`.

    apiVersions:
      '2025-08-01-preview':
        schema:
          type: object
          properties:
            environment:
              type: string
              description: "(Required) The Radius Environment ID. Typically set by the rad CLI. Typically value should be `environment`."
            application:
              type: string
              description: "(Optional) The Radius Application ID. `myApplication.id` for example."
            componentType:
              type: string
              description: "(Optional) The Dapr component type, such as `secretstores.kubernetes` or `secretstores.azure.keyvault`. If not set, the Recipe deploys a `secretstores.kubernetes` component. See https://docs.dapr.io/reference/components-reference/supported-secret-stores/ for values."
            version:
              type: string
              description: "(Optional) The Dapr component version. Defaults to `v1`."
            metadata:
              type: object
              description: "(Optional) Map of Dapr component metadata names to values. Each entry must set `value` or `secretKeyRef`. Do not put secret material in `value`; use `secretKeyRef`. A `secretKeyRef` in a secret store component reads a Kubernetes secret."
              additionalProperties:
                type: object
                properties:
                  value:
                    type: string
                    description: "(Optional) The plain text value of the metadata entry."
                  secretKeyRef:
                    type: object
                    description: "(Optional) A reference to a value in a Kubernetes secret in the namespace of the component."
                    properties:
                      name:
                        type: string
                        description: "(Required) The name of the Kubernetes secret."
                      key:
                        type: string
                        description: "(Required) The key to select in the Kubernetes secret."
                    required: [name, key]
            componentName:
              type: string
              readOnly: true
              description: "(Read Only) The name of the Dapr component. Use this value with the Dapr client and in `auth.secretStore` of other Dapr components."
          required: [environment]
