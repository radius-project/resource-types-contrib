# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Release Namespace

# Cuts an independent, per-namespace release of the resource-type manifests.
#
# Each namespace (`Radius.<Category>`) is versioned and tagged on its own series:
#   tag:     Radius.<Category>/v<major>.<minor>.<patch>[-<prerelease>]
#   asset:   Radius.<Category>-manifests-v<version>.tar.gz  (+ checksums.txt)
#
# Every published release artifact gets a signed SLSA build provenance
# attestation (actions/attest-build-provenance), verifiable with
#   gh attestation verify <asset> --repo radius-project/resource-types-contrib
#
# Git tags are the single source of truth for the current version -- there is no
# version file to maintain. A maintainer triggers this workflow, picks the
# namespace and a bump type, and the workflow computes the next version, builds
# the manifest bundle, and publishes a GitHub Release. This is the release side
# of the per-namespace sync design (radius PR #12236): publishing per-namespace
# versioned artifacts is what makes Radius's per-namespace `resourceTypes[].ref`
# pins meaningful.
#
# The run is a no-op unless the namespace has something new to publish. Each
# namespace is released on its own cadence, so the check compares this commit
# against the namespace's own latest stable release tag and looks only at the
# files that namespace ships -- unrelated churn elsewhere in the monorepo never
# bumps its version. When nothing changed, no tag, release, or recipe publish is
# created; `force` overrides that for a deliberate re-cut.
#
# Downstream: publishing the release fires `notify-radius.yaml` on
# `release: published`, which dispatches the per-namespace pin (this tag) to
# radius-project/radius as a reviewable sync PR. The release is created with the
# RESOURCE_TYPES_BOT GitHub App token (not GITHUB_TOKEN) precisely so that the
# `release: published` event is allowed to trigger that downstream workflow.
#
# The pin Radius records is a commit SHA, and a released `rad` reuses that SHA
# as the OCI tag of every recipe in the namespace (radius PR #12566). So the
# release commit's recipes are published to GHCR under that SHA *before* the
# release exists, and the tag is verified to resolve back to it afterwards.
#
# Prerequisite (one-time, admin): the RESOURCE_TYPES_BOT GitHub App must be
# installed on this repository with `contents: write` so it can create the tag
# and release. `dry_run` needs no token and is safe to run anytime.
#
# To release a new namespace folder, add it to the `namespace` choice list below.

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: Namespace to release
        type: choice
        required: true
        options:
          - Radius.AI
          - Radius.Compute
          - Radius.Data
          - Radius.Messaging
          - Radius.Security
      bump:
        description: Semantic version bump
        type: choice
        required: true
        default: minor
        options:
          - patch
          - minor
          - major
      prerelease_label:
        description: "Optional prerelease label (e.g. rc.1, beta.1); marks the release as a prerelease"
        type: string
        required: false
        default: ""
      force:
        description: Release even when nothing changed since the last release
        type: boolean
        required: false
        default: false
      dry_run:
        description: Compute the version and build the bundle without tagging or publishing
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  # One release at a time per namespace; never cancel an in-flight release.
  group: release-namespace-${{ inputs.namespace }}
  cancel-in-progress: false

jobs:
  check:
    name: Check ${{ inputs.namespace }} for unreleased changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      # The gate for every other job: a release is only worth cutting when this
      # namespace changed since its own last stable release.
      should_release: ${{ steps.changes.outputs.changed == 'true' || inputs.force }}
      changed: ${{ steps.changes.outputs.changed }}
      previous_tag: ${{ steps.changes.outputs.previous_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags so the baseline release tag resolves.
          fetch-depth: 0
          fetch-tags: true

      - name: Detect changes since the last release
        id: changes
        env:
          NAMESPACE: ${{ inputs.namespace }}
        run: ./.github/scripts/release/detect-changes.sh

      - name: Summarize
        env:
          NAMESPACE: ${{ inputs.namespace }}
          CHANGED: ${{ steps.changes.outputs.changed }}
          PREVIOUS_TAG: ${{ steps.changes.outputs.previous_tag }}
          COUNT: ${{ steps.changes.outputs.count }}
          FORCED: ${{ inputs.force }}
        run: |
          {
            echo "## Unreleased changes in ${NAMESPACE}"
            echo ""
            echo "* Baseline: \`${PREVIOUS_TAG}\`"
            echo "* Changed files in the release scope: \`${COUNT}\`"
            if [ "$CHANGED" = "true" ]; then
              echo "* Result: changes found -- continuing with the release"
            elif [ "$FORCED" = "true" ]; then
              echo "* Result: unchanged, but \`force\` was set -- continuing with the release"
            else
              echo "* Result: **nothing to release**"
              echo ""
              echo "\`${NAMESPACE}\` is unchanged since \`${PREVIOUS_TAG}\`, so no tag, release, or recipe publish was created. Re-run with \`force\` to cut a release anyway."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  publish-recipes:
    name: Publish recipes for the release commit
    # A namespace pin is also an OCI coordinate: a released `rad` resolves
    # `Radius.<Category>` to the commit SHA this release tag points at and pulls
    # `ghcr.io/radius-project/kube-recipes/<recipe>:<sha>` (radius PR #12566).
    # Publishing here makes that tag a precondition of releasing instead of
    # something a later push has to backfill -- if it fails, no release is cut
    # and Radius never sees a pin it cannot resolve. `pin_only` keeps the
    # floating `edge`/`latest` aliases where they are; only the immutable SHA
    # tag is (re)published.
    needs: check
    if: ${{ !inputs.dry_run && needs.check.outputs.should_release == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-bicep-recipes.yaml
    with:
      pin_only: true

  release:
    name: Release ${{ inputs.namespace }}
    needs: [check, publish-recipes]
    if: >-
      !cancelled() &&
      github.repository == 'radius-project/resource-types-contrib' &&
      needs.check.outputs.should_release == 'true' &&
      (
        (inputs.dry_run && needs.publish-recipes.result == 'skipped') ||
        (!inputs.dry_run && github.ref == 'refs/heads/main' && needs.publish-recipes.result == 'success')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Read is enough for checkout; the tag/release is created with the App
      # token so that `release: published` can trigger notify-radius.yaml.
      contents: read
      # Sign and record a build provenance attestation for the release artifact.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags so version resolution and release notes work.
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: ver
        env:
          NAMESPACE: ${{ inputs.namespace }}
          BUMP: ${{ inputs.bump }}
          PRERELEASE_LABEL: ${{ inputs.prerelease_label }}
        run: ./.github/scripts/release/next-version.sh

      - name: Build manifest bundle
        id: bundle
        env:
          NAMESPACE: ${{ inputs.namespace }}
          VERSION: ${{ steps.ver.outputs.next }}
          OUT_DIR: dist
        run: ./.github/scripts/release/build-namespace-bundle.sh

      - name: Generate release notes
        id: notes
        env:
          NAMESPACE: ${{ inputs.namespace }}
          TAG: ${{ steps.ver.outputs.tag }}
          # Same baseline the change check used, so the notes and the decision
          # to release describe the same range.
          PREV: ${{ needs.check.outputs.previous_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          folder="${NAMESPACE#Radius.}"
          prev="$PREV"
          if [ "$prev" = "none" ]; then
            prev=""
          fi
          if [ -n "$prev" ]; then
            range="${prev}..HEAD"
          else
            range="HEAD"
          fi
          {
            echo "## ${TAG}"
            echo ""
            if [ -n "$prev" ]; then
              echo "Changes in \`${folder}/\` since \`${prev}\`:"
            else
              echo "Initial release of the \`${NAMESPACE}\` namespace."
            fi
            echo ""
            changes="$(git log --no-merges --pretty='- %s (%h)' "$range" -- "${folder}/" || true)"
            if [ -n "$changes" ]; then
              echo "$changes"
            else
              echo "- No manifest changes since the previous release."
            fi
          } > dist/notes.md
          {
            echo "prev=${prev:-none}"
          } >> "$GITHUB_OUTPUT"
          echo "--- release notes ---"
          cat dist/notes.md

      - name: Attest build provenance
        # Generate a signed SLSA build provenance attestation for the release
        # bundle so consumers can cryptographically verify it was built by this
        # workflow and has not been tampered with. Runs before publishing so a
        # released artifact is always attested (fail-closed). Verify with:
        #   gh attestation verify <asset> --repo radius-project/resource-types-contrib
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.bundle.outputs.asset }}

      - name: Generate App Token
        # Create the release as the RESOURCE_TYPES_BOT App (not GITHUB_TOKEN) so
        # the `release: published` event triggers notify-radius.yaml. Requires
        # the App installed on this repo with contents:write.
        if: ${{ !inputs.dry_run }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RESOURCE_TYPES_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RESOURCE_TYPES_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Create tag and GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          IS_PRERELEASE: ${{ steps.ver.outputs.is_prerelease }}
          ASSET: ${{ steps.bundle.outputs.asset }}
          CHECKSUMS: ${{ steps.bundle.outputs.checksums }}
        run: |
          set -euo pipefail
          args=(--target "$GITHUB_SHA" --title "$TAG" --notes-file dist/notes.md --latest=false)
          if [ "$IS_PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}" "$ASSET" "$CHECKSUMS"

      - name: Verify the tag resolves to the published commit
        # Radius turns this tag into a commit SHA with `git ls-remote` and uses
        # that SHA as the recipe OCI tag, which the publish-recipes job pushed
        # as $GITHUB_SHA. `gh release create` makes a lightweight tag, so the
        # two match; an annotated tag would resolve to the tag object instead
        # and the pin would point at a SHA that was never published. Fail loudly
        # rather than ship a release whose recipes are unreachable.
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          resolved="$(git ls-remote origin "refs/tags/${TAG}" | awk '{print $1}')"
          if [ "$resolved" != "$GITHUB_SHA" ]; then
            echo "Error: ${TAG} resolves to '${resolved:-<missing>}' but recipes were published as :${GITHUB_SHA}." >&2
            exit 1
          fi
          echo "${TAG} -> ${resolved}"

      - name: Summarize
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          FORCED: ${{ needs.check.outputs.changed != 'true' }}
        run: |
          {
            echo "## Release ${{ steps.ver.outputs.tag }}"
            echo ""
            echo "* Namespace: \`${{ inputs.namespace }}\`"
            echo "* Current -> next: \`${{ steps.ver.outputs.current }}\` -> \`${{ steps.ver.outputs.next }}\`"
            echo "* Since previous tag: \`${{ steps.notes.outputs.prev }}\`"
            if [ "$FORCED" = "true" ]; then
              echo "* Forced: no changes since the previous release"
            fi
            echo "* Prerelease: \`${{ steps.ver.outputs.is_prerelease }}\`"
            echo "* Manifests bundled: \`${{ steps.bundle.outputs.count }}\`"
            echo "* Asset: \`$(basename "${{ steps.bundle.outputs.asset }}")\`"
            if [ "$DRY_RUN" = "true" ]; then
              echo ""
              echo "_Dry run: no tag, release, or attestation was created._"
            else
              echo "* Provenance: attested (verify with \`gh attestation verify <asset> --repo ${{ github.repository }}\`)"
              echo "* Recipes: published as \`${GITHUB_SHA}\`, the tag Radius resolves this pin to"
              echo ""
              echo "Published as \`${{ steps.ver.outputs.tag }}\`; notify-radius.yaml will open the per-namespace sync PR in radius."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
