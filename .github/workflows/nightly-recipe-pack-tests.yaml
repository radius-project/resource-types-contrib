# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Nightly Recipe and Pack Tests

# Test every repository recipe through generated Bicep and Terraform packs.
# Then deploy every checked-in Recipe Pack and exercise every entry that has
# a test/app.bicep. Repository-owned entries use recipes built from this
# checkout; external modules retain the versions declared in each pack.
#
# Runs nightly rather than per-PR because the Azure job creates and deletes
# real cloud infrastructure for every runnable Recipe Pack entry.

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily
  workflow_dispatch:
    inputs:
      version:
        description: "Radius version number to use (e.g. 0.51.0, 0.51.0-rc1, edge)."
        required: false
        default: edge
        type: string

permissions: {}

jobs:
  nightly-kubernetes-recipe-pack-tests:
    name: Nightly Recipe and Pack Tests (Kubernetes)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RAD_ENVIRONMENT_NAME: default
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Set up ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: "1.2.0"

      - name: Install Radius CLI
        run: make install-radius-cli RAD_VERSION="${{ inputs.version || 'edge' }}"

      # This sets up a local k3d cluster for testing purposes and creates a
      # workspace, group, and default environment.
      - name: Create Radius Cluster
        run: make create-radius-cluster

      - name: Build Resource Types and Kubernetes Recipes
        run: RECIPE_PLATFORM_FILTER=kubernetes make build

      - name: Test Kubernetes Bicep recipes
        id: kubernetes_bicep
        continue-on-error: true
        run: |
          set -euo pipefail
          pack_name="nightlybiceprecipepack"
          pack_file="recipe-pack-nightly-bicep.bicep"
          RECIPE_PLATFORM_FILTER=kubernetes make generate-recipe-pack \
            PACK_NAME="$pack_name" \
            OUTPUT_FILE="$pack_file"
          if [[ ! -f "$pack_file" ]]; then
            echo "No Kubernetes bicep recipes found."
            exit 0
          fi
          make deploy-recipe-pack BICEP_FILE="$pack_file"
          make update-env-recipe-pack \
            RECIPE_PACK_NAME="$pack_name" \
            ENVIRONMENT="$RAD_ENVIRONMENT_NAME"
          RECIPE_PLATFORM_FILTER=kubernetes make test \
            ENVIRONMENT="$RAD_ENVIRONMENT_NAME" \
            RECIPE_TYPE=bicep

      - name: Test Kubernetes Terraform recipes
        id: kubernetes_terraform
        continue-on-error: true
        run: |
          set -euo pipefail
          pack_name="nightlyterraformrecipepack"
          pack_file="recipe-pack-nightly-terraform.bicep"
          RECIPE_PLATFORM_FILTER=kubernetes make generate-recipe-pack \
            PACK_NAME="$pack_name" \
            OUTPUT_FILE="$pack_file"
          if [[ ! -f "$pack_file" ]]; then
            echo "No Kubernetes terraform recipes found."
            exit 0
          fi
          make deploy-recipe-pack BICEP_FILE="$pack_file"
          make update-env-recipe-pack \
            RECIPE_PACK_NAME="$pack_name" \
            ENVIRONMENT="$RAD_ENVIRONMENT_NAME"
          RECIPE_PLATFORM_FILTER=kubernetes make test \
            ENVIRONMENT="$RAD_ENVIRONMENT_NAME" \
            RECIPE_TYPE=terraform

      - name: Deploy checked-in Kubernetes Recipe Pack
        id: kubernetes_pack_deploy
        continue-on-error: true
        env:
          RECIPE_PACK_USE_LOCAL_RECIPES: "true"
        run: .github/scripts/deploy-all-checked-in-recipe-packs.sh kubernetes "$RAD_ENVIRONMENT_NAME"

      - name: Test all runnable Recipe Pack entries
        id: kubernetes_pack_entries
        continue-on-error: true
        run: make test-recipe-pack-entries PLATFORM_GROUP=kubernetes WORKSPACE=default ENVIRONMENT="$RAD_ENVIRONMENT_NAME"

      - name: Report Kubernetes test failures
        if: ${{ !cancelled() }}
        env:
          BICEP_OUTCOME: ${{ steps.kubernetes_bicep.outcome }}
          TERRAFORM_OUTCOME: ${{ steps.kubernetes_terraform.outcome }}
          PACK_DEPLOY_OUTCOME: ${{ steps.kubernetes_pack_deploy.outcome }}
          PACK_ENTRIES_OUTCOME: ${{ steps.kubernetes_pack_entries.outcome }}
        run: |
          failures=0
          for result in \
            "Bicep recipes:$BICEP_OUTCOME" \
            "Terraform recipes:$TERRAFORM_OUTCOME" \
            "checked-in pack deployment:$PACK_DEPLOY_OUTCOME" \
            "checked-in pack entries:$PACK_ENTRIES_OUTCOME"; do
            name="${result%%:*}"
            outcome="${result#*:}"
            if [[ "$outcome" != "success" ]]; then
              echo "::error::$name finished with outcome '$outcome'"
              failures=1
            fi
          done
          exit "$failures"

      - name: Collect Radius pod logs
        if: always()
        run: |
          mkdir -p radius-pod-logs
          APP_POD=$(kubectl get pods -n radius-system -o json | jq -r '.items[] | select(.metadata.name | startswith("applications-rp-")) | .metadata.name' | head -n1)
          if [ -n "$APP_POD" ]; then
            kubectl logs "$APP_POD" -n radius-system --all-containers > radius-pod-logs/applications-rp.log || true
          else
            echo "applications-rp pod not found" > radius-pod-logs/applications-rp.log
          fi
          UCP_POD=$(kubectl get pods -n radius-system -o json | jq -r '.items[] | select(.metadata.name | startswith("ucp-")) | .metadata.name' | head -n1)
          if [ -n "$UCP_POD" ]; then
            kubectl logs "$UCP_POD" -n radius-system --all-containers > radius-pod-logs/ucp.log || true
          else
            echo "ucp pod not found" > radius-pod-logs/ucp.log
          fi
          DRP_POD=$(kubectl get pods -n radius-system -o json | jq -r '.items[] | select(.metadata.name | startswith("dynamic-rp-")) | .metadata.name' | head -n1)
          if [ -n "$DRP_POD" ]; then
            kubectl logs "$DRP_POD" -n radius-system --all-containers > radius-pod-logs/dynamic-rp.log || true
          else
            echo "dynamic-rp pod not found" > radius-pod-logs/dynamic-rp.log
          fi

      - name: Upload Radius pod logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: radius-pod-logs-nightly-kubernetes
          path: radius-pod-logs
          if-no-files-found: warn

  nightly-azure-recipe-pack-tests:
    name: Nightly Recipe and Pack Tests (Azure)
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      id-token: write
      contents: read
    outputs:
      resource_group: ${{ steps.set-context.outputs.resource_group }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set Azure Test Context
        id: set-context
        run: |
          LOCATION="${AZURE_LOCATION:-$DEFAULT_AZURE_LOCATION}"
          if [ -z "$LOCATION" ]; then
            LOCATION="westus3"
          fi
          RG="rrttest-nightly-${{ github.run_id }}-${{ github.run_attempt }}"
          {
            echo "AZURE_LOCATION=$LOCATION"
            echo "AZURE_RESOURCE_GROUP=$RG"
            echo "AZURE_WORKSPACE_NAME=default"
            echo "AZURE_ENVIRONMENT_NAME=default"
          } >> "$GITHUB_ENV"
          echo "resource_group=$RG" >> "$GITHUB_OUTPUT"
        env:
          DEFAULT_AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}

      - name: Create Azure Resource Group
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          RG="$AZURE_RESOURCE_GROUP"
          LOCATION="$AZURE_LOCATION"
          current_time=$(date +%s)
          az group create \
            --only-show-errors \
            --output none \
            --location "$LOCATION" \
            --name "$RG" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --tags "creationTime=$current_time" > /dev/null
          while [[ "$(az group exists --name "$RG" --subscription "$AZURE_SUBSCRIPTION_ID")" != "true" ]]; do
            echo "Waiting for resource group '$RG' to be available..."
            sleep 5
          done
          echo "Resource group '$RG' is ready"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Set up ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: "1.2.0"

      - name: Install Radius CLI
        run: make install-radius-cli RAD_VERSION="${{ inputs.version || 'edge' }}"

      - name: Create Radius Cluster
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TEST_AZURE_OIDC_JSON: ${{ secrets.TEST_AZURE_OIDC_JSON }}
        run: make create-radius-cluster

      - name: Configure Azure Provider
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: make configure-azure-provider

      - name: Build Azure Recipes
        run: make build-azure-recipes

      - name: Test Azure Bicep recipes
        id: azure_bicep
        continue-on-error: true
        timeout-minutes: 75
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RTC_AZURE_DIAGNOSTICS_DIR: azure-test-diagnostics
        run: |
          set -euo pipefail
          pack_name="nightlyazurebiceprecipepack"
          pack_file="recipe-pack-nightly-azure-bicep.bicep"
          RECIPE_PLATFORM_FILTER=azure make generate-recipe-pack \
            PACK_NAME="$pack_name" \
            OUTPUT_FILE="$pack_file"
          if [[ ! -f "$pack_file" ]]; then
            echo "No Azure bicep recipes found."
            exit 0
          fi
          make deploy-recipe-pack BICEP_FILE="$pack_file" RESOURCE_GROUP=default
          make update-env-recipe-pack \
            RECIPE_PACK_NAME="$pack_name" \
            ENVIRONMENT="$AZURE_ENVIRONMENT_NAME"
          RECIPE_PLATFORM_FILTER=azure make test \
            ENVIRONMENT="$AZURE_ENVIRONMENT_NAME" \
            RECIPE_TYPE=bicep

      - name: Test Azure Terraform recipes
        id: azure_terraform
        continue-on-error: true
        timeout-minutes: 75
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RTC_AZURE_DIAGNOSTICS_DIR: azure-test-diagnostics
        run: |
          set -euo pipefail
          pack_name="nightlyazureterraformrecipepack"
          pack_file="recipe-pack-nightly-azure-terraform.bicep"
          RECIPE_PLATFORM_FILTER=azure make generate-recipe-pack \
            PACK_NAME="$pack_name" \
            OUTPUT_FILE="$pack_file"
          if [[ ! -f "$pack_file" ]]; then
            echo "No Azure terraform recipes found."
            exit 0
          fi
          make deploy-recipe-pack BICEP_FILE="$pack_file" RESOURCE_GROUP=default
          make update-env-recipe-pack \
            RECIPE_PACK_NAME="$pack_name" \
            ENVIRONMENT="$AZURE_ENVIRONMENT_NAME"
          RECIPE_PLATFORM_FILTER=azure make test \
            ENVIRONMENT="$AZURE_ENVIRONMENT_NAME" \
            RECIPE_TYPE=terraform

      - name: Deploy checked-in Azure Recipe Packs
        id: azure_pack_deploy
        continue-on-error: true
        timeout-minutes: 15
        env:
          RECIPE_PACK_USE_LOCAL_RECIPES: "true"
        run: .github/scripts/deploy-all-checked-in-recipe-packs.sh azure "$AZURE_ENVIRONMENT_NAME"

      - name: Test all runnable Recipe Pack entries
        id: azure_pack_entries
        continue-on-error: true
        timeout-minutes: 120
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RTC_AZURE_DIAGNOSTICS_DIR: azure-test-diagnostics
        run: make test-recipe-pack-entries PLATFORM_GROUP=azure WORKSPACE="$AZURE_WORKSPACE_NAME" ENVIRONMENT="$AZURE_ENVIRONMENT_NAME"

      - name: Upload pre-cleanup Azure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: azure-test-diagnostics-nightly-azure
          path: azure-test-diagnostics
          if-no-files-found: ignore

      - name: Report Azure test failures
        if: ${{ !cancelled() }}
        env:
          BICEP_OUTCOME: ${{ steps.azure_bicep.outcome }}
          TERRAFORM_OUTCOME: ${{ steps.azure_terraform.outcome }}
          PACK_DEPLOY_OUTCOME: ${{ steps.azure_pack_deploy.outcome }}
          PACK_ENTRIES_OUTCOME: ${{ steps.azure_pack_entries.outcome }}
        run: |
          failures=0
          for result in \
            "Bicep recipes:$BICEP_OUTCOME" \
            "Terraform recipes:$TERRAFORM_OUTCOME" \
            "checked-in pack deployment:$PACK_DEPLOY_OUTCOME" \
            "checked-in pack entries:$PACK_ENTRIES_OUTCOME"; do
            name="${result%%:*}"
            outcome="${result#*:}"
            if [[ "$outcome" != "success" ]]; then
              echo "::error::$name finished with outcome '$outcome'"
              failures=1
            fi
          done
          exit "$failures"

      - name: Collect Radius pod logs
        if: always()
        run: |
          mkdir -p radius-pod-logs
          APP_POD=$(kubectl get pods -n radius-system -o json | jq -r '.items[] | select(.metadata.name | startswith("applications-rp-")) | .metadata.name' | head -n1)
          if [ -n "$APP_POD" ]; then
            kubectl logs "$APP_POD" -n radius-system --all-containers > radius-pod-logs/applications-rp.log || true
          else
            echo "applications-rp pod not found" > radius-pod-logs/applications-rp.log
          fi
          UCP_POD=$(kubectl get pods -n radius-system -o json | jq -r '.items[] | select(.metadata.name | startswith("ucp-")) | .metadata.name' | head -n1)
          if [ -n "$UCP_POD" ]; then
            kubectl logs "$UCP_POD" -n radius-system --all-containers > radius-pod-logs/ucp.log || true
          else
            echo "ucp pod not found" > radius-pod-logs/ucp.log
          fi
          DRP_POD=$(kubectl get pods -n radius-system -o json | jq -r '.items[] | select(.metadata.name | startswith("dynamic-rp-")) | .metadata.name' | head -n1)
          if [ -n "$DRP_POD" ]; then
            kubectl logs "$DRP_POD" -n radius-system --all-containers > radius-pod-logs/dynamic-rp.log || true
          else
            echo "dynamic-rp pod not found" > radius-pod-logs/dynamic-rp.log
          fi

      - name: Upload Radius pod logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: radius-pod-logs-nightly-azure
          path: radius-pod-logs
          if-no-files-found: warn

  cleanup-azure-resources:
    name: Cleanup Azure Resources
    needs: nightly-azure-recipe-pack-tests
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Cleanup Azure Resources
        env:
          AZURE_RESOURCE_GROUP: ${{ needs.nightly-azure-recipe-pack-tests.outputs.resource_group }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: make cleanup-azure-resources
