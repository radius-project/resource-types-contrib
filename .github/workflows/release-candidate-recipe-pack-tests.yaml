# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Release Candidate Recipe and Pack Tests

# Runs the nightly Recipe and Pack tests (nightly-recipe-pack-tests.yaml)
# against what a Radius release candidate actually ships, instead of `main`.
#
# The Radius release's deploy/manifest/defaults.yaml (at tag v<version>) pins
# every resource type namespace and Recipe Pack to a commit of this repository.
# prepare-release-candidate-sources.sh restores those released revisions into
# the checkout and points each Recipe Pack's repository-owned recipes at the
# OCI tags published for the pinned commit -- the same tags the released `rad`
# resolves. The test scripts then run unchanged:
#   * Bicep and Terraform recipes built from the released namespace sources.
#   * The released Recipe Packs, deployed with the published recipes.
#   * Every runnable entry of those packs.
#
# Run it after a Radius release candidate is cut and before the final release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Radius release candidate version to test (e.g. 0.62.0-rc.1)."
        required: true
        type: string

permissions: {}

concurrency:
  group: release-candidate-recipe-pack-tests-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  rc-kubernetes-recipe-pack-tests:
    name: Release Candidate Recipe and Pack Tests (Kubernetes)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RAD_ENVIRONMENT_NAME: default
      RTC_TEST_DIAGNOSTICS_DIR: test-diagnostics
      RTC_TEST_PLATFORM: kubernetes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use sources released with Radius ${{ inputs.version }}
        id: rc
        env:
          RADIUS_VERSION: ${{ inputs.version }}
        run: ./.github/scripts/release/prepare-release-candidate-sources.sh

      - name: Verify published Recipe sources resolve
        run: |
          set -euo pipefail
          source .github/scripts/lib-recipe-packs.sh
          # A separate assignment lets set -e stop the job when enumeration fails.
          packs="$(rtc_recipe_packs_for_platform_group kubernetes)"
          for pack in $packs; do
            RECIPE_PACK="$pack" ./.github/scripts/release/verify-recipe-pack-sources.sh
          done

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Set up ORAS
        uses: ./.github/actions/setup-oras

      - name: Install Radius CLI
        env:
          RAD_VERSION: ${{ steps.rc.outputs.radius_version }}
        run: make install-radius-cli RAD_VERSION="$RAD_VERSION"

      # This sets up a local k3d cluster for testing purposes and creates a
      # workspace, group, and default environment.
      - name: Create Radius Cluster
        run: make create-radius-cluster

      - name: Build released Resource Types and Kubernetes Recipes
        run: RECIPE_PLATFORM_FILTER=kubernetes make build

      - name: Test released Kubernetes Bicep recipes
        id: kubernetes_bicep
        continue-on-error: true
        run: |
          set -euo pipefail
          pack_name="candidatebiceprecipepack"
          pack_file="recipe-pack-rc-bicep.bicep"
          RECIPE_PLATFORM_FILTER=kubernetes make generate-recipe-pack \
            PACK_NAME="$pack_name" \
            OUTPUT_FILE="$pack_file"
          if [[ ! -f "$pack_file" ]]; then
            echo "No Kubernetes bicep recipes found."
            exit 0
          fi
          make deploy-recipe-pack BICEP_FILE="$pack_file"
          make update-env-recipe-pack \
            RECIPE_PACK_NAME="$pack_name" \
            ENVIRONMENT="$RAD_ENVIRONMENT_NAME"
          RECIPE_PLATFORM_FILTER=kubernetes make test \
            ENVIRONMENT="$RAD_ENVIRONMENT_NAME" \
            RECIPE_TYPE=bicep

      - name: Test released Kubernetes Terraform recipes
        id: kubernetes_terraform
        continue-on-error: true
        run: |
          set -euo pipefail
          pack_name="candidateterraformrecipepack"
          pack_file="recipe-pack-rc-terraform.bicep"
          RECIPE_PLATFORM_FILTER=kubernetes make generate-recipe-pack \
            PACK_NAME="$pack_name" \
            OUTPUT_FILE="$pack_file"
          if [[ ! -f "$pack_file" ]]; then
            echo "No Kubernetes terraform recipes found."
            exit 0
          fi
          make deploy-recipe-pack BICEP_FILE="$pack_file"
          make update-env-recipe-pack \
            RECIPE_PACK_NAME="$pack_name" \
            ENVIRONMENT="$RAD_ENVIRONMENT_NAME"
          RECIPE_PLATFORM_FILTER=kubernetes make test \
            ENVIRONMENT="$RAD_ENVIRONMENT_NAME" \
            RECIPE_TYPE=terraform

      - name: Deploy released Kubernetes Recipe Packs
        id: kubernetes_pack_deploy
        continue-on-error: true
        run: .github/scripts/deploy-all-checked-in-recipe-packs.sh kubernetes "$RAD_ENVIRONMENT_NAME"

      - name: Test all runnable released Recipe Pack entries
        id: kubernetes_pack_entries
        continue-on-error: true
        run: make test-recipe-pack-entries PLATFORM_GROUP=kubernetes WORKSPACE=default ENVIRONMENT="$RAD_ENVIRONMENT_NAME"

      - name: Collect workflow failure diagnostics
        if: ${{ !cancelled() && (failure() || steps.kubernetes_bicep.outcome == 'failure' || steps.kubernetes_terraform.outcome == 'failure' || steps.kubernetes_pack_deploy.outcome == 'failure' || steps.kubernetes_pack_entries.outcome == 'failure') }}
        continue-on-error: true
        run: |
          source .github/scripts/lib-recipe-test.sh
          rtc_collect_test_diagnostics workflow workflow-failure "$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-diagnostics-rc-kubernetes
          path: test-diagnostics
          if-no-files-found: ignore

      - name: Report Kubernetes test failures
        if: ${{ !cancelled() }}
        env:
          BICEP_OUTCOME: ${{ steps.kubernetes_bicep.outcome }}
          TERRAFORM_OUTCOME: ${{ steps.kubernetes_terraform.outcome }}
          PACK_DEPLOY_OUTCOME: ${{ steps.kubernetes_pack_deploy.outcome }}
          PACK_ENTRIES_OUTCOME: ${{ steps.kubernetes_pack_entries.outcome }}
        run: |
          failures=0
          for result in \
            "Bicep recipes:$BICEP_OUTCOME" \
            "Terraform recipes:$TERRAFORM_OUTCOME" \
            "released pack deployment:$PACK_DEPLOY_OUTCOME" \
            "released pack entries:$PACK_ENTRIES_OUTCOME"; do
            name="${result%%:*}"
            outcome="${result#*:}"
            if [[ "$outcome" != "success" ]]; then
              echo "::error::$name finished with outcome '$outcome'"
              failures=1
            fi
          done
          exit "$failures"

      - name: Collect Radius pod logs
        if: always()
        run: |
          mkdir -p radius-pod-logs
          APP_POD=$(kubectl get pods -n radius-system -o json | jq -r '.items[] | select(.metadata.name | startswith("applications-rp-")) | .metadata.name' | head -n1)
          if [ -n "$APP_POD" ]; then
            kubectl logs "$APP_POD" -n radius-system --all-containers > radius-pod-logs/applications-rp.log || true
          else
            echo "applications-rp pod not found" > radius-pod-logs/applications-rp.log
          fi
          DE_POD=$(kubectl get pods -n radius-system -o json | jq -r '.items[] | select(.metadata.name | test("^(deployment-engine|bicep-de)-")) | .metadata.name' | head -n1)
          if [ -n "$DE_POD" ]; then
            kubectl logs "$DE_POD" -n radius-system --all-containers > radius-pod-logs/deployment-engine.log || true
          else
            echo "deployment engine pod not found" > radius-pod-logs/deployment-engine.log
          fi
          UCP_POD=$(kubectl get pods -n radius-system -o json | jq -r '.items[] | select(.metadata.name | startswith("ucp-")) | .metadata.name' | head -n1)
          if [ -n "$UCP_POD" ]; then
            kubectl logs "$UCP_POD" -n radius-system --all-containers > radius-pod-logs/ucp.log || true
          else
            echo "ucp pod not found" > radius-pod-logs/ucp.log
          fi
          DRP_POD=$(kubectl get pods -n radius-system -o json | jq -r '.items[] | select(.metadata.name | startswith("dynamic-rp-")) | .metadata.name' | head -n1)
          if [ -n "$DRP_POD" ]; then
            kubectl logs "$DRP_POD" -n radius-system --all-containers > radius-pod-logs/dynamic-rp.log || true
          else
            echo "dynamic-rp pod not found" > radius-pod-logs/dynamic-rp.log
          fi

      - name: Upload Radius pod logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: radius-pod-logs-rc-kubernetes
          path: radius-pod-logs
          if-no-files-found: warn

  rc-azure-context:
    name: Prepare Release Candidate Azure Context
    runs-on: ubuntu-24.04
    outputs:
      resource_group: ${{ steps.context.outputs.resource_group }}
      probe_resource_group: ${{ steps.context.outputs.probe_resource_group }}
      owner_token: ${{ steps.context.outputs.owner_token }}
      regions: ${{ steps.context.outputs.regions }}
      sizes: ${{ steps.context.outputs.sizes }}
    steps:
      - name: Generate owned group names
        id: context
        env:
          REGION_OVERRIDE: ${{ vars.RTC_AZURE_TEST_REGIONS }}
          PRIMARY_REGION: ${{ vars.AZURE_LOCATION }}
          FALLBACK_REGION: ${{ vars.AZURE_FALLBACK_LOCATION }}
          SIZE_OVERRIDE: ${{ vars.RTC_POSTGRES_TEST_SIZES }}
        run: |
          set -euo pipefail
          base="rrttest-rc-${{ github.run_id }}-${{ github.run_attempt }}"
          owner_token="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          regions="${REGION_OVERRIDE:-${PRIMARY_REGION:-westus3},${FALLBACK_REGION:-eastus2},centralus}"
          sizes="${SIZE_OVERRIDE:-S,M}"
          [[ "$owner_token" =~ ^[a-f0-9]{32}$ ]] || exit 1
          [[ "$regions" =~ ^[a-z0-9]+(,[a-z0-9]+)*$ ]] || exit 1
          [[ "$sizes" =~ ^[SM](,[SM])*$ ]] || exit 1
          {
            echo "resource_group=${base}-${owner_token}"
            echo "probe_resource_group=${base}-probe-${owner_token}"
            echo "owner_token=$owner_token"
            echo "regions=$regions"
            echo "sizes=$sizes"
          } >> "$GITHUB_OUTPUT"

  rc-azure-postgres-preflight:
    name: Release Candidate Azure PostgreSQL Preflight
    needs: rc-azure-context
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/azure-postgres-preflight.yaml
    with:
      probe_resource_group: ${{ needs.rc-azure-context.outputs.probe_resource_group }}
      owner_token: ${{ needs.rc-azure-context.outputs.owner_token }}
      regions: ${{ needs.rc-azure-context.outputs.regions }}
      sizes: ${{ needs.rc-azure-context.outputs.sizes }}
      artifact_name: postgres-preflight-rc-azure
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  rc-azure-recipe-pack-tests:
    name: Release Candidate Recipe and Pack Tests (Azure)
    needs:
      - rc-azure-context
      - rc-azure-postgres-preflight
    if: ${{ needs.rc-azure-postgres-preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      id-token: write
      contents: read
    env:
      RTC_TEST_DIAGNOSTICS_DIR: azure-test-diagnostics
      RTC_TEST_PLATFORM: azure
      AZURE_RESOURCE_GROUP: ${{ needs.rc-azure-context.outputs.resource_group }}
      AZURE_GROUP_OWNER_TOKEN: ${{ needs.rc-azure-context.outputs.owner_token }}
      AZURE_PROBE_RESOURCE_GROUP: ${{ needs.rc-azure-context.outputs.probe_resource_group }}
      AZURE_LOCATION: ${{ needs.rc-azure-postgres-preflight.outputs.location }}
      AZURE_WORKSPACE_NAME: default
      AZURE_ENVIRONMENT_NAME: default
      RTC_AZURE_SELECTION_FILE: ${{ github.workspace }}/azure-test-diagnostics/postgres-selection.json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use sources released with Radius ${{ inputs.version }}
        id: rc
        env:
          RADIUS_VERSION: ${{ inputs.version }}
        run: ./.github/scripts/release/prepare-release-candidate-sources.sh

      - name: Prepare parameterized PostgreSQL test harness
        run: |
          set -euo pipefail
          harness="$RUNNER_TEMP/postgresql-test-app.bicep"
          bash .github/scripts/prepare-postgres-test-harness.sh \
            Data/postgreSqlDatabases/test/app.bicep "$harness"
          echo "RTC_POSTGRES_TEST_HARNESS=$harness" >> "$GITHUB_ENV"

      - name: Verify published Recipe sources resolve
        run: |
          set -euo pipefail
          source .github/scripts/lib-recipe-packs.sh
          # A separate assignment lets set -e stop the job when enumeration fails.
          packs="$(rtc_recipe_packs_for_platform_group azure)"
          for pack in $packs; do
            RECIPE_PACK="$pack" ./.github/scripts/release/verify-recipe-pack-sources.sh
          done

      - name: Record PostgreSQL preflight result
        env:
          SELECTION_STATUS: ${{ needs.rc-azure-postgres-preflight.outputs.status }}
          SELECTED_SIZE: ${{ needs.rc-azure-postgres-preflight.outputs.size }}
          SELECTED_SKU: ${{ needs.rc-azure-postgres-preflight.outputs.sku }}
          SELECTED_TIER: ${{ needs.rc-azure-postgres-preflight.outputs.tier }}
          ATTEMPTS: ${{ needs.rc-azure-postgres-preflight.outputs.attempts }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RTC_AZURE_SELECTION_FILE")"
          deadline=$(( $(date +%s) + 2700 ))
          jq -n --arg status "$SELECTION_STATUS" --arg location "$AZURE_LOCATION" \
            --arg size "$SELECTED_SIZE" --arg skuName "$SELECTED_SKU" \
            --arg tier "$SELECTED_TIER" --argjson attempts "$ATTEMPTS" \
            --argjson deadlineEpochSeconds "$deadline" '
            {version:1,status:$status,location:$location,attempts:$attempts,
             deadlineEpochSeconds:$deadlineEpochSeconds}
            + (if $status == "selected" then
                {postgres:{size:$size,skuName:$skuName,tier:$tier}}
              else {} end)
          ' > "$RTC_AZURE_SELECTION_FILE"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Set up ORAS
        uses: ./.github/actions/setup-oras

      - name: Install Radius CLI
        env:
          RAD_VERSION: ${{ steps.rc.outputs.radius_version }}
        run: make install-radius-cli RAD_VERSION="$RAD_VERSION"

      - name: Create Radius Cluster
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TEST_AZURE_OIDC_JSON: ${{ secrets.TEST_AZURE_OIDC_JSON }}
        run: make create-radius-cluster

      - name: Build released Azure Recipes
        run: make build-azure-recipes

      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Enable Azure CLI token renewal
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: bash .github/scripts/azure-cli-with-refresh.sh --install

      - name: Create Azure Resource Group
        timeout-minutes: 5
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          bash .github/scripts/azure-postgres-workflow.sh create-main rc \
            "$AZURE_RESOURCE_GROUP" "$AZURE_LOCATION" "$AZURE_GROUP_OWNER_TOKEN"

      - name: Configure Azure Provider
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: make configure-azure-provider

      - name: Deploy released Azure Recipe Packs
        id: azure_pack_deploy
        continue-on-error: true
        timeout-minutes: 15
        run: .github/scripts/deploy-all-checked-in-recipe-packs.sh azure "$AZURE_ENVIRONMENT_NAME"

      - name: Test released PostgreSQL Recipe Pack entry
        id: azure_postgres_entry
        if: ${{ needs.rc-azure-postgres-preflight.outputs.status == 'selected' }}
        continue-on-error: true
        timeout-minutes: 45
        env:
          RTC_AZURE_DIAGNOSTICS_DIR: azure-test-diagnostics
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RTC_AZURE_PACK_ENTRY_PHASE: postgres
        run: |
          export RTC_AZURE_TEST_STEP_DEADLINE_EPOCH=$(( $(date +%s) + 45 * 60 ))
          make test-recipe-pack-entries PLATFORM_GROUP=azure WORKSPACE="$AZURE_WORKSPACE_NAME" ENVIRONMENT="$AZURE_ENVIRONMENT_NAME"

      - name: Test unrelated released Recipe Pack entries
        id: azure_pack_entries
        continue-on-error: true
        timeout-minutes: 60
        env:
          RTC_AZURE_DIAGNOSTICS_DIR: azure-test-diagnostics
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RTC_AZURE_PACK_ENTRY_PHASE: unrelated
        run: |
          export RTC_AZURE_TEST_STEP_DEADLINE_EPOCH=$(( $(date +%s) + 60 * 60 ))
          make test-recipe-pack-entries PLATFORM_GROUP=azure WORKSPACE="$AZURE_WORKSPACE_NAME" ENVIRONMENT="$AZURE_ENVIRONMENT_NAME"

      - name: Test released Azure Bicep recipes
        id: azure_bicep
        continue-on-error: true
        timeout-minutes: 55
        env:
          RTC_AZURE_DIAGNOSTICS_DIR: azure-test-diagnostics
        run: |
          set -euo pipefail
          pack_name="candidateazurebiceprecipepack"
          export RTC_AZURE_TEST_STEP_DEADLINE_EPOCH=$(( $(date +%s) + 55 * 60 ))
          pack_file="recipe-pack-rc-azure-bicep.bicep"
          RECIPE_PLATFORM_FILTER=azure make generate-recipe-pack \
            PACK_NAME="$pack_name" \
            OUTPUT_FILE="$pack_file"
          if [[ ! -f "$pack_file" ]]; then
            echo "No Azure bicep recipes found."
            exit 0
          fi
          make deploy-recipe-pack BICEP_FILE="$pack_file" RESOURCE_GROUP=default
          make update-env-recipe-pack \
            RECIPE_PACK_NAME="$pack_name" \
            ENVIRONMENT="$AZURE_ENVIRONMENT_NAME"
          RECIPE_PLATFORM_FILTER=azure make test \
            ENVIRONMENT="$AZURE_ENVIRONMENT_NAME" \
            RECIPE_TYPE=bicep

      - name: Test released Azure Terraform recipes
        id: azure_terraform
        continue-on-error: true
        timeout-minutes: 55
        env:
          RTC_AZURE_DIAGNOSTICS_DIR: azure-test-diagnostics
        run: |
          set -euo pipefail
          pack_name="candidateazureterraformrecipepack"
          export RTC_AZURE_TEST_STEP_DEADLINE_EPOCH=$(( $(date +%s) + 55 * 60 ))
          pack_file="recipe-pack-rc-azure-terraform.bicep"
          RECIPE_PLATFORM_FILTER=azure make generate-recipe-pack \
            PACK_NAME="$pack_name" \
            OUTPUT_FILE="$pack_file"
          if [[ ! -f "$pack_file" ]]; then
            echo "No Azure terraform recipes found."
            exit 0
          fi
          make deploy-recipe-pack BICEP_FILE="$pack_file" RESOURCE_GROUP=default
          make update-env-recipe-pack \
            RECIPE_PACK_NAME="$pack_name" \
            ENVIRONMENT="$AZURE_ENVIRONMENT_NAME"
          RECIPE_PLATFORM_FILTER=azure make test \
            ENVIRONMENT="$AZURE_ENVIRONMENT_NAME" \
            RECIPE_TYPE=terraform

      - name: Collect workflow failure diagnostics
        if: ${{ !cancelled() && (failure() || steps.azure_postgres_entry.outcome == 'failure' || steps.azure_bicep.outcome == 'failure' || steps.azure_terraform.outcome == 'failure' || steps.azure_pack_deploy.outcome == 'failure' || steps.azure_pack_entries.outcome == 'failure') }}
        continue-on-error: true
        run: |
          source .github/scripts/lib-recipe-test.sh
          rtc_collect_test_diagnostics workflow workflow-failure "$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload pre-cleanup Azure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: azure-test-diagnostics-rc-azure
          path: azure-test-diagnostics
          if-no-files-found: ignore

      - name: Report Azure test failures
        if: ${{ !cancelled() }}
        env:
          POSTGRES_OUTCOME: ${{ steps.azure_postgres_entry.outcome }}
          BICEP_OUTCOME: ${{ steps.azure_bicep.outcome }}
          TERRAFORM_OUTCOME: ${{ steps.azure_terraform.outcome }}
          PACK_DEPLOY_OUTCOME: ${{ steps.azure_pack_deploy.outcome }}
          PACK_ENTRIES_OUTCOME: ${{ steps.azure_pack_entries.outcome }}
        run: |
          bash .github/scripts/report-azure-test-failures.sh \
            "PostgreSQL entry:$POSTGRES_OUTCOME" \
            "Bicep recipes:$BICEP_OUTCOME" \
            "Terraform recipes:$TERRAFORM_OUTCOME" \
            "released pack deployment:$PACK_DEPLOY_OUTCOME" \
            "unrelated pack entries:$PACK_ENTRIES_OUTCOME"

      - name: Collect Radius pod logs
        if: always()
        run: |
          mkdir -p radius-pod-logs
          APP_POD=$(kubectl get pods -n radius-system -o json | jq -r '.items[] | select(.metadata.name | startswith("applications-rp-")) | .metadata.name' | head -n1)
          if [ -n "$APP_POD" ]; then
            kubectl logs "$APP_POD" -n radius-system --all-containers > radius-pod-logs/applications-rp.log || true
          else
            echo "applications-rp pod not found" > radius-pod-logs/applications-rp.log
          fi
          DE_POD=$(kubectl get pods -n radius-system -o json | jq -r '.items[] | select(.metadata.name | test("^(deployment-engine|bicep-de)-")) | .metadata.name' | head -n1)
          if [ -n "$DE_POD" ]; then
            kubectl logs "$DE_POD" -n radius-system --all-containers > radius-pod-logs/deployment-engine.log || true
          else
            echo "deployment engine pod not found" > radius-pod-logs/deployment-engine.log
          fi
          UCP_POD=$(kubectl get pods -n radius-system -o json | jq -r '.items[] | select(.metadata.name | startswith("ucp-")) | .metadata.name' | head -n1)
          if [ -n "$UCP_POD" ]; then
            kubectl logs "$UCP_POD" -n radius-system --all-containers > radius-pod-logs/ucp.log || true
          else
            echo "ucp pod not found" > radius-pod-logs/ucp.log
          fi
          DRP_POD=$(kubectl get pods -n radius-system -o json | jq -r '.items[] | select(.metadata.name | startswith("dynamic-rp-")) | .metadata.name' | head -n1)
          if [ -n "$DRP_POD" ]; then
            kubectl logs "$DRP_POD" -n radius-system --all-containers > radius-pod-logs/dynamic-rp.log || true
          else
            echo "dynamic-rp pod not found" > radius-pod-logs/dynamic-rp.log
          fi

      - name: Upload Radius pod logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: radius-pod-logs-rc-azure
          path: radius-pod-logs
          if-no-files-found: warn

  cleanup-azure-resources:
    name: Cleanup Azure Resources
    needs:
      - rc-azure-context
      - rc-azure-postgres-preflight
      - rc-azure-recipe-pack-tests
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Cleanup resource groups owned by this run
        if: always()
        timeout-minutes: 26
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          EXPECTED_PROBE_RESOURCE_GROUP: ${{ needs.rc-azure-context.outputs.probe_resource_group }}
          PREFLIGHT_RESULT: ${{ needs.rc-azure-postgres-preflight.result }}
        run: |
          set -u
          cleanup_status=0
          if [[ "$PREFLIGHT_RESULT" != success ]]; then
            sleep 180
          fi
          bash .github/scripts/azure-postgres-workflow.sh cleanup-probe \
            "$EXPECTED_PROBE_RESOURCE_GROUP" || cleanup_status=1
          bash .github/scripts/azure-postgres-workflow.sh cleanup-run-groups rc ||
            cleanup_status=1
          exit "$cleanup_status"
