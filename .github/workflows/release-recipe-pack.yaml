# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Release Recipe Pack

# Cuts an independent, per-recipe-pack release of the Recipe Packs.
#
# Each pack (a directory under `recipe-packs/`) is versioned and tagged on its own
# series, prefixed so it never collides with the namespace tag series:
#   tag:     recipe-pack/<pack>/v<major>.<minor>.<patch>[-<prerelease>]
#   asset:   recipe-pack-<pack>-v<version>.tar.gz  (+ checksums.txt)
#
# Every published release artifact gets a signed SLSA build provenance
# attestation (actions/attest-build-provenance), verifiable with
#   gh attestation verify <asset> --repo radius-project/resource-types-contrib
#
# Git tags are the single source of truth for the current version -- there is no
# version file to maintain. A maintainer triggers this workflow, picks the pack
# and a bump type, and the workflow computes the next version, builds the pack
# bundle, and publishes a GitHub Release. This mirrors release-namespace.yaml and
# shares its release scripts.
#
# The run is a no-op unless the pack has something new to publish. Each pack is
# released on its own cadence, so the check compares this commit against the
# pack's own latest stable release tag and looks only at that pack's directory --
# unrelated churn elsewhere in the monorepo never bumps its version. When nothing
# changed, no tag or release is created; `force` overrides that for a deliberate
# re-cut. A `dry_run` publishes nothing, so it previews the version and the
# bundle either way.
#
# Downstream: publishing a stable release fires `notify-radius.yaml` on
# `release: released`, which dispatches the pack pin (this tag) to
# radius-project/radius as a reviewable sync PR. Prereleases do not notify.
# Radius records the stable tag under `recipePacks[]` in
# deploy/manifest/defaults.yaml but does not vendor the pack; its deploy
# workflows fetch the pack Bicep from here at deploy time. The release is
# created with the RESOURCE_TYPES_BOT GitHub App token (not GITHUB_TOKEN) so the
# release event can trigger that downstream workflow.
#
# Prerequisite (one-time, admin): the RESOURCE_TYPES_BOT GitHub App must be
# installed on this repository with `contents: write` so it can create the tag
# and release. `dry_run` needs no token and is safe to run anytime.
#
# To release a new recipe pack folder, add it to the `recipe_pack` choice list
# below.

on:
  workflow_dispatch:
    inputs:
      recipe_pack:
        description: Recipe pack to release
        type: choice
        required: true
        options:
          - azure
          - kubernetes
      bump:
        description: Semantic version bump
        type: choice
        required: true
        default: minor
        options:
          - patch
          - minor
          - major
      prerelease_label:
        description: Optional prerelease label (e.g. rc.1, beta.1); marks the release as a prerelease
        type: string
        required: false
        default: ""
      force:
        description: Release even when nothing changed since the last release
        type: boolean
        required: false
        default: false
      dry_run:
        description: Compute the version and build the bundle without tagging or publishing
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  # One release at a time per recipe pack; never cancel an in-flight release.
  group: release-recipe-pack-${{ inputs.recipe_pack }}
  cancel-in-progress: false

jobs:
  check:
    name: Check ${{ inputs.recipe_pack }} for unreleased changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      # The gate for the release job: a release is only worth cutting when this
      # pack changed since its own last stable release.
      should_release: ${{ steps.changes.outputs.changed == 'true' || inputs.force }}
      changed: ${{ steps.changes.outputs.changed }}
      previous_tag: ${{ steps.changes.outputs.previous_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags so the baseline release tag resolves.
          fetch-depth: 0
          fetch-tags: true

      - name: Detect changes since the last release
        id: changes
        env:
          RECIPE_PACK: ${{ inputs.recipe_pack }}
        run: ./.github/scripts/release/detect-changes.sh

      - name: Summarize
        env:
          RECIPE_PACK: ${{ inputs.recipe_pack }}
          CHANGED: ${{ steps.changes.outputs.changed }}
          REASON: ${{ steps.changes.outputs.reason }}
          PREVIOUS_TAG: ${{ steps.changes.outputs.previous_tag }}
          COUNT: ${{ steps.changes.outputs.count }}
          FORCED: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # With no baseline to diff against, the count is the whole release
          # scope rather than a change count -- say so instead of reporting it
          # as if a comparison had happened.
          case "$REASON" in
            no-previous-release)
              scope="Files in the release scope: \`${COUNT}\` (first release, so every file is new)"
              verdict="first release -- continuing"
              ;;
            previous-release-unreachable)
              scope="Files in the release scope: \`${COUNT}\` (nothing was compared: the baseline is unreachable from this checkout)"
              verdict="cannot compare against \`${PREVIOUS_TAG}\` -- continuing rather than skip a real release"
              ;;
            *)
              scope="Changed files in the release scope: \`${COUNT}\`"
              verdict="changes found -- continuing with the release"
              ;;
          esac
          {
            echo "## Unreleased changes in the ${RECIPE_PACK} recipe pack"
            echo ""
            echo "* Baseline: \`${PREVIOUS_TAG}\`"
            echo "* ${scope}"
            if [ "$CHANGED" = "true" ]; then
              echo "* Result: ${verdict}"
            elif [ "$FORCED" = "true" ]; then
              echo "* Result: unchanged, but \`force\` was set -- continuing with the release"
            elif [ "$DRY_RUN" = "true" ]; then
              echo "* Result: unchanged, but a dry run publishes nothing -- continuing with the preview"
            else
              echo "* Result: **nothing to release**"
              echo ""
              echo "The \`${RECIPE_PACK}\` recipe pack is unchanged since \`${PREVIOUS_TAG}\`, so no tag or release was created. Re-run with \`force\` to cut a release anyway."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  release:
    name: Release recipe pack ${{ inputs.recipe_pack }}
    needs: check
    # A dry run publishes nothing, so the change gate does not apply to it --
    # previewing the version and the bundle must never require `force`. Only a
    # real release is gated on there being something to release.
    if: >-
      github.repository == 'radius-project/resource-types-contrib' &&
      (
        inputs.dry_run ||
        (github.ref == 'refs/heads/main' && needs.check.outputs.should_release == 'true')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Read is enough for checkout; the tag/release is created with the App
      # token so release events behave the same as for namespace releases.
      contents: read
      # Sign and record a build provenance attestation for the release artifact.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags so version resolution and release notes work.
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: ver
        env:
          RECIPE_PACK: ${{ inputs.recipe_pack }}
          BUMP: ${{ inputs.bump }}
          PRERELEASE_LABEL: ${{ inputs.prerelease_label }}
        run: ./.github/scripts/release/next-version.sh

      - name: Build recipe pack bundle
        id: bundle
        env:
          RECIPE_PACK: ${{ inputs.recipe_pack }}
          VERSION: ${{ steps.ver.outputs.next }}
          OUT_DIR: dist
        run: ./.github/scripts/release/build-recipe-pack-bundle.sh

      - name: Generate release notes
        id: notes
        env:
          RECIPE_PACK: ${{ inputs.recipe_pack }}
          TAG: ${{ steps.ver.outputs.tag }}
          # Same baseline the change check used, so the notes and the decision
          # to release describe the same range.
          PREV: ${{ needs.check.outputs.previous_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          folder="recipe-packs/${RECIPE_PACK}"
          prev="$PREV"
          if [ "$prev" = "none" ]; then
            prev=""
          fi
          if [ -n "$prev" ]; then
            range="${prev}..HEAD"
          else
            range="HEAD"
          fi
          {
            echo "## ${TAG}"
            echo ""
            if [ -n "$prev" ]; then
              echo "Changes in \`${folder}/\` since \`${prev}\`:"
            else
              echo "Initial release of the \`${RECIPE_PACK}\` recipe pack."
            fi
            echo ""
            changes="$(git log --no-merges --pretty='- %s (%h)' "$range" -- "${folder}/" || true)"
            if [ -n "$changes" ]; then
              echo "$changes"
            else
              echo "- No recipe pack changes since the previous release."
            fi
          } > dist/notes.md
          {
            echo "prev=${prev:-none}"
          } >> "$GITHUB_OUTPUT"
          echo "--- release notes ---"
          cat dist/notes.md

      - name: Attest build provenance
        # Generate a signed SLSA build provenance attestation for the release
        # bundle so consumers can cryptographically verify it was built by this
        # workflow and has not been tampered with. Runs before publishing so a
        # released artifact is always attested (fail-closed). Verify with:
        #   gh attestation verify <asset> --repo radius-project/resource-types-contrib
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.bundle.outputs.asset }}

      - name: Generate App Token
        # Create the release as the RESOURCE_TYPES_BOT App (not GITHUB_TOKEN) so
        # release events are allowed to trigger downstream workflows. Requires
        # the App installed on this repo with contents:write.
        if: ${{ !inputs.dry_run }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RESOURCE_TYPES_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RESOURCE_TYPES_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Create tag and GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          IS_PRERELEASE: ${{ steps.ver.outputs.is_prerelease }}
          ASSET: ${{ steps.bundle.outputs.asset }}
          CHECKSUMS: ${{ steps.bundle.outputs.checksums }}
        run: |
          set -euo pipefail
          args=(--target "$GITHUB_SHA" --title "$TAG" --notes-file dist/notes.md --latest=false)
          if [ "$IS_PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}" "$ASSET" "$CHECKSUMS"

      - name: Summarize
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          UNCHANGED: ${{ needs.check.outputs.changed != 'true' }}
          IS_PRERELEASE: ${{ steps.ver.outputs.is_prerelease }}
        run: |
          {
            echo "## Release ${{ steps.ver.outputs.tag }}"
            echo ""
            echo "* Recipe pack: \`${{ inputs.recipe_pack }}\`"
            echo "* Current -> next: \`${{ steps.ver.outputs.current }}\` -> \`${{ steps.ver.outputs.next }}\`"
            echo "* Since previous tag: \`${{ steps.notes.outputs.prev }}\`"
            if [ "$UNCHANGED" = "true" ]; then
              echo "* Nothing changed since the previous release"
            fi
            echo "* Prerelease: \`${{ steps.ver.outputs.is_prerelease }}\`"
            echo "* Templates bundled: \`${{ steps.bundle.outputs.count }}\`"
            echo "* Asset: \`$(basename "${{ steps.bundle.outputs.asset }}")\`"
            if [ "$DRY_RUN" = "true" ]; then
              echo ""
              echo "_Dry run: no tag, release, or attestation was created._"
            else
              echo "* Provenance: attested (verify with \`gh attestation verify <asset> --repo ${{ github.repository }}\`)"
              echo ""
              if [ "$IS_PRERELEASE" = "true" ]; then
                echo "Published as \`${{ steps.ver.outputs.tag }}\`; prereleases do not notify Radius."
              else
                echo "Published as \`${{ steps.ver.outputs.tag }}\`; notify-radius.yaml will open the recipe-pack sync PR in Radius."
              fi
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
