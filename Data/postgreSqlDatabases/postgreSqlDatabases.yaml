namespace: Radius.Data
types:
  postgreSqlDatabases:  
    description: |
      The Radius.Data/postgreSqlDatabases Resource Type deploys a PostgreSQL database. Provide the administrator `username` and `password` directly on the resource. The `password` property is marked `x-radius-sensitive`, so Radius encrypts it at rest, redacts it on reads, and exposes it (decrypted) only to the recipe that provisions the database.
      ```bicep
      resource postgresql 'Radius.Data/postgreSqlDatabases@2025-08-01-preview' = {
          name: 'postgresql'
          properties: {
            environment: environment
            application: myApplication.id
            size: 'S'
            database: 'appdb'
            username: 'myadmin'
            // From a @secure() password parameter passed in via the CLI
            password: password
            extensions: [
              'pg_trgm'
              'btree_gin'
            ]
            serverSettings: {
              log_min_duration_statement: '1000'
            }
          }
        }
      ```

      When deploying the application definition, provide the database password value as a parameter. It is recommended to use a password generator such as `openssl` or equivalent. For example, `rad deploy app.bicep -p password=$(openssl rand -hex 16)`.

      To connect your container to the database, create a connection from the Container resource to the database as shown below. 
      ```bicep
      resource myApplication 'Radius.Core/Applications@2025-08-01-preview' = { ... }

      resource frontend 'Radius.Compute/containers@2025-08-01-preview' = {
        name: 'frontend'
        properties: {
          application: myApplication.id
          environment: environment
          container: {
            image: 'frontend:1.25'
            ports: {
              web: {
                containerPort: 8080
              }
            }
          }
          connections: {
            postgresql: {
              source: postgresql.id
            }
          }
        }
      }
      ```

      The connection automatically injects environment variables into the container for all properties from the database. The environment variables are named `CONNECTION_<CONNECTION-NAME>_<PROPERTY-NAME>`. In this example, the connection name is `postgresql` so the environment variables will be:
 
      - CONNECTION_POSTGRESQL_DATABASE
      - CONNECTION_POSTGRESQL_HOST
      - CONNECTION_POSTGRESQL_PORT
      - CONNECTION_POSTGRESQL_TLS

    apiVersions:
      '2025-08-01-preview':
        schema: 
          type: object
          properties:
            environment:
              type: string
              description: "(Required) The Radius Environment ID. Typically set by the rad CLI. Typically value should be `environment`."
            application:
              type: string
              description: "(Optional) The Radius Application ID. `myApplication.id` for example."
            size:
              type: string
              enum: ['S', 'M', 'L']
              default: 'S'
              description: "(Optional) The size of the PostgreSQL database. Defaults to `S` if not provided."
            username:
              type: string
              description: "(Required) The administrator username for the PostgreSQL database. Provided directly on the resource and passed to the recipe as `{{context.resource.properties.username}}`."
            password:
              type: string
              x-radius-sensitive: true
              description: "(Required) The administrator password for the PostgreSQL database. Marked `x-radius-sensitive`: Radius encrypts it at rest, redacts it on reads, and exposes it decrypted only to the recipe as `{{context.resource.properties.password}}`."
            database:
              type: string
              default: postgres_db
              description: "(Optional) The name of the database. Defaults to `postgres_db` if not provided."
            initSql:
              type: string
              x-radius-sensitive: true
              description: "(Optional) SQL script for schemas, users, and seed data. Encrypted by Radius. Azure runs it after server configuration and database creation, using a deployment script; it must be safe to run again. Kubernetes mounts it from a Secret and runs it when PGDATA is empty, after creating requested extensions. Changes do not run against existing Kubernetes volumes. Limited by platform script and environment-variable sizes."
            tls:
              type: string
              enum: ['required', 'optional']
              default: 'required'
              description: "(Optional) The requested transport policy for database connections. Configure your client using `CONNECTION_POSTGRESQL_TLS`. Defaults to `required`. Use `optional` only when the server is not publicly reachable; it permits connections without TLS."
            extensions:
              type: array
              default: []
              items:
                type: string
                minLength: 1
                pattern: '^[a-z][a-z0-9_-]*$'
              description: "(Optional) Required PostgreSQL extension names, such as pg_trgm or vector. Azure allow-lists them; application migrations must create them in each database. Kubernetes creates them on first database initialization; the container image must include each extension."
            serverSettings:
              type: object
              default: {}
              additionalProperties:
                type: string
              description: "(Optional) PostgreSQL server parameter names and string values. Azure operator settings override matching application settings. The extensions and tls properties control azure.extensions and require_secure_transport unless the operator overrides them. Kubernetes passes settings to postgres with -c; invalid or unavailable settings fail startup. Do not put credentials in this object."
            host:
              type: string
              description: "(Read Only) The host name used to connect to the database. Mapped from the recipe module's output."
              readOnly: true
            port:
              type: integer
              default: 5432
              description: "(Optional) The TCP port used to connect to the database. Defaults to `5432`, the standard PostgreSQL port that every Recipe in this repository provisions and the port PostgreSQL flexible server is fixed to. A Recipe that provisions the database on a different port reports the real port as an output, which overwrites this value once the deployment finishes. Setting it in an application definition changes only the value reported to connected containers, never the port the server listens on, so leave it unset."
          required: [environment,username,password]
